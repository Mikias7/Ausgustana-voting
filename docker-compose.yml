# Local development database only. Not used in production.
# Start: docker compose up -d    Stop: docker compose down    (data persists in the asa_pgdata volume)
services:
  db:
    image: postgres:18-alpine
    container_name: asa-voting-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: asa_voting
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
      POSTGRES_DB: asa_voting
    ports:
      # Port 5433 so it never clashes with a locally installed PostgreSQL on 5432.
      # Bound to 127.0.0.1 so it is not reachable from the network.
      - "127.0.0.1:5433:5432"
    volumes:
      - asa_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asa_voting -d asa_voting"]
      interval: 5s
      retries: 10

volumes:
  asa_pgdata:
